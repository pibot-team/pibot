services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: pibot
      POSTGRES_PASSWORD: pibot
      POSTGRES_DB: pibot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  ai:
    build: ./ai
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://pibot:pibot@db:5432/pibot
      BACKEND_URL: http://host.docker.internal:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  pgdata:
