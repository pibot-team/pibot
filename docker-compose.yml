services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: pibot
      POSTGRES_PASSWORD: pibot
      POSTGRES_DB: pibot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  ai:
    build: ./ai
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://pibot:pibot@db:5432/pibot
      BACKEND_URL: http://backend:8080
    ports:
      - "8000:8000"
    depends_on:
      - db

  # Spring 세팅 후 주석 해제
  # backend:
  #   build: ./backend
  #   env_file:
  #     - path: .env
  #       required: false
  #   environment:
  #     SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/pibot
  #     SPRING_DATASOURCE_USERNAME: pibot
  #     SPRING_DATASOURCE_PASSWORD: pibot
  #     AI_URL: http://ai:8000
  #   ports:
  #     - "8080:8080"
  #   depends_on:
  #     - db

volumes:
  pgdata:
