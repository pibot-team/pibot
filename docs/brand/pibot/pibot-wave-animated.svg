<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="480" height="480">
<style>
.pv-eyes{transform-box:fill-box;transform-origin:center}
.pv-pb{animation:pv-pb 4s infinite ease-in-out}
.pv-happy{animation:pv-happy 4s infinite ease-in-out}
.pv-arm{transform-box:fill-box;transform-origin:50% 90%;animation:pv-wave 4s infinite ease-in-out}
.pv-dot{animation:pv-bob 2s infinite ease-in-out}
.pv-body{animation:pv-hop 4s infinite ease-in-out}
@keyframes pv-pb{0%,48%{opacity:1;transform:scaleY(1)}54%{opacity:1;transform:scaleY(.1)}56%,92%{opacity:0;transform:scaleY(.1)}96%{opacity:1;transform:scaleY(.1)}100%{opacity:1;transform:scaleY(1)}}
@keyframes pv-happy{0%,54%{opacity:0;transform:scaleY(.2)}60%,88%{opacity:1;transform:scaleY(1)}92%,100%{opacity:0;transform:scaleY(.2)}}
@keyframes pv-wave{0%,56%{transform:rotate(0deg)}64%{transform:rotate(-18deg)}72%{transform:rotate(8deg)}80%{transform:rotate(-18deg)}88%,100%{transform:rotate(0deg)}}
@keyframes pv-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes pv-hop{0%,56%,100%{transform:translateY(0)}62%{transform:translateY(-6px)}68%{transform:translateY(0)}}
@media (prefers-reduced-motion: reduce){.pv-pb,.pv-happy,.pv-arm,.pv-dot,.pv-body{animation:none}.pv-happy{opacity:0}}
</style>
<defs><radialGradient id="mv-dot" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#FFFFFF"></stop><stop offset="0.55" stop-color="#E4E6FF"></stop><stop offset="1" stop-color="#A9B4FF"></stop></radialGradient></defs>
<ellipse cx="120" cy="214" rx="48" ry="6" fill="#4A5BD9" fill-opacity="0.12"></ellipse>
<g class="pv-body">
<line x1="132" y1="64" x2="132" y2="44" stroke="#6F8BFF" stroke-width="7" stroke-linecap="round"></line>
<g class="pv-dot"><circle cx="132" cy="34" r="12" fill="url(#mv-dot)"></circle><circle cx="127.8" cy="29.8" r="3.4" fill="#FFFFFF"></circle></g>
<rect class="pv-arm" x="178" y="92" width="16" height="34" rx="8" fill="#4A5BD9" transform="rotate(-150 186 100)"></rect>
<rect x="56" y="62" width="128" height="140" rx="56" fill="#6F8BFF"></rect>
<rect x="70" y="84" width="100" height="64" rx="32" fill="#1F2030"></rect>
<path d="M84 96 Q100 88 124 90" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="5" stroke-linecap="round"></path>
<g class="pv-eyes pv-pb" fill="none" stroke="#C9D3FF" stroke-width="4.5" stroke-linecap="round"><circle cx="104" cy="118" r="7"></circle><line x1="97" y1="118" x2="97" y2="131.3"></line><circle cx="138" cy="118" r="7"></circle><line x1="131" y1="118" x2="131" y2="104.7"></line></g>
<g class="pv-eyes pv-happy" fill="none" stroke="#C9D3FF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><path d="M95 121 L104 112 L113 121"></path><path d="M129 121 L138 112 L147 121"></path></g>
</g>
</svg>
